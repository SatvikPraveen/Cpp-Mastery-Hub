# Reverse proxy giving the app a single origin.
#   /            -> frontend (Next.js)
#   /api/        -> backend (REST)
#   /socket.io/  -> backend (WebSocket upgrade)
#   /health      -> backend health
# The analysis engine is deliberately not routed: only the backend may call it.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;

    # Source files are capped at 256 KiB by the API; 1 MiB matches the backend body limit.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000; }

    server {
        listen 80;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_read_timeout 30s;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        location = /health {
            proxy_pass http://backend/health;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}

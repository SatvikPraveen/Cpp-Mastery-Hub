# Production deployment from images published by CI to GHCR.
#   RELEASE_VERSION=<git sha> docker compose -f docker-compose.prod.yml up -d
# Provide secrets through the environment or a secrets manager; nothing has a default.
# Put TLS in front of the nginx service (e.g. a cloud load balancer or certbot sidecar).

name: cpp-mastery-hub


x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpp_mastery_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  cpp-engine:
    image: ghcr.io/satvikpraveen/cppmastery-engine:${RELEASE_VERSION:-latest}
    <<: *hardening
    deploy:
      replicas: 2
      resources:
        limits: { memory: 256M, cpus: "1.0" }

  backend:
    image: ghcr.io/satvikpraveen/cppmastery-backend:${RELEASE_VERSION:-latest}
    <<: *hardening
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-cpp_mastery_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_URL: redis://redis:6379
      CPP_ENGINE_URL: http://cpp-engine:9000
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      CORS_ORIGIN: ${CORS_ORIGIN:?required}
      FRONTEND_URL: ${FRONTEND_URL:?required}
      SMTP_HOST: ${SMTP_HOST:?required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:?required}
    depends_on: [postgres, redis, cpp-engine]
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  frontend:
    image: ghcr.io/satvikpraveen/cppmastery-frontend:${RELEASE_VERSION:-latest}
    <<: *hardening
    depends_on: [backend]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["80:80"]
    depends_on: [frontend, backend]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

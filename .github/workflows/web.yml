name: web

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run type-check --workspace backend
      - name: Lint
        run: npm run lint --workspace backend
      - name: Unit tests
        run: npm test --workspace backend -- --ci --passWithNoTests
      - name: Prisma schema validation
        run: npx prisma validate --schema backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  frontend:
    name: frontend / node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run type-check --workspace frontend
      - name: Lint
        run: npm run lint --workspace frontend
      - name: Unit tests
        run: npm test --workspace frontend -- --ci --passWithNoTests
      - name: Production build
        run: npm run build --workspace frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

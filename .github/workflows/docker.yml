name: docker

on:
  push:
    branches: [main]
    paths: ['cpp-engine/**', 'backend/**', 'frontend/**', 'docker/**', '.github/workflows/docker.yml']
  pull_request:
    paths: ['cpp-engine/**', 'docker/**', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  engine-image:
    name: cpp-engine image (build = tests + eval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (runs the test suite and evaluation inside the build stage)
        uses: docker/build-push-action@v6
        with:
          context: cpp-engine
          load: true
          tags: cppmastery-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the runtime image
        run: |
          docker run --rm cppmastery-engine:ci version
          echo 'int main(){ char b[8]; gets(b); return 0; }' | docker run --rm -i cppmastery-engine:ci analyze - ; test $? -eq 1
          docker run --rm cppmastery-engine:ci rules --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["rules"])==20'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: cpp-engine
          push: true
          tags: |
            ghcr.io/satvikpraveen/cppmastery-engine:latest
            ghcr.io/satvikpraveen/cppmastery-engine:${{ github.sha }}
          cache-from: type=gha

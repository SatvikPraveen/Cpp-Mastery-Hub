name: docker

on:
  push:
    branches: [main]
    paths: ['cpp-engine/**', 'backend/**', 'frontend/**', 'docker/**', 'package-lock.json', '.github/workflows/docker.yml']
  pull_request:
    paths: ['cpp-engine/**', 'backend/**', 'frontend/**', 'docker/**', 'package-lock.json', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  engine-image:
    name: cpp-engine image (build = tests + eval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (runs the test suite and evaluation inside the build stage)
        uses: docker/build-push-action@v6
        with:
          context: cpp-engine
          build-args: GIT_REVISION=${{ github.sha }}
          load: true
          tags: cppmastery-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the runtime image
        run: |
          docker run --rm cppmastery-engine:ci version
          rc=0; echo 'int main(){ char b[8]; gets(b); return 0; }' | docker run --rm -i cppmastery-engine:ci analyze - || rc=$?
          test "$rc" -eq 1   # exit 1 = error-level diagnostics found, as expected
          docker run --rm cppmastery-engine:ci rules --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["rules"])==20'
          docker run -d --name engine-http -p 9000:9000 cppmastery-engine:ci
          for i in $(seq 1 20); do curl -fs http://localhost:9000/health && break; sleep 1; done
          curl -fs -X POST http://localhost:9000/analyze -H 'Content-Type: application/json' -d '{"code":"int main(){}"}' | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"]=="cppmastery.analysis/1"'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: cpp-engine
          build-args: GIT_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/satvikpraveen/cppmastery-engine:latest
            ghcr.io/satvikpraveen/cppmastery-engine:${{ github.sha }}
          cache-from: type=gha

  web-images:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: cppmastery-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Smoke test (process starts and stays up)
        if: matrix.service == 'frontend'
        run: |
          docker run -d --name smoke -p 3000:3000 cppmastery-frontend:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 2; done
          curl -fs http://localhost:3000/api/health
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/satvikpraveen/cppmastery-${{ matrix.service }}:latest
            ghcr.io/satvikpraveen/cppmastery-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build-mode: none }
          - { language: c-cpp,                 build-mode: manual }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build engine for CodeQL
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S cpp-engine -B cpp-engine/build/codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCPPMASTERY_BUILD_TESTS=OFF
          cmake --build cpp-engine/build/codeql --parallel
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

# Infrastructure for native development: run backend and frontend with npm on the host.
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgresql://postgres:dev@localhost:5432/cpp_mastery_hub
#   CPP_ENGINE_URL=http://localhost:9000  SMTP_HOST=localhost SMTP_PORT=1025
# Emails sent by the backend (verification, password reset) appear at http://localhost:8025.

name: cpp-mastery-hub-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cpp_mastery_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cpp_mastery_hub"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  cpp-engine:
    build:
      context: ./cpp-engine
    environment:
      CPPMASTERY_MAX_BODY: 1048576
      CPPMASTERY_TIMEOUT: 10
    ports: ["9000:9000"]

  mailpit:
    # Captures outgoing SMTP so verification and reset emails can be read locally.
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_dev_data:
